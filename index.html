<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro CV Builder - Print-Ready 1-Page Resume Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#2563eb',
                    }
                }
            }
        }
    </script>

    <style>
        /* Font Selector Dynamic CSS Classes */
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-opensans { font-family: 'Open Sans', sans-serif; }
        .font-lato { font-family: 'Lato', sans-serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* A4 Canvas Dimensions (210mm x 297mm @ standard screen PPI) */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            height: 297mm;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Responsive Scaling Wrapper */
        .canvas-scale-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
            min-height: calc(100vh - 64px);
            overflow-y: auto;
        }

        /* Custom Scrollbar for Sidebar */
        .sidebar-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        /* Print Media Styles */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            .canvas-scale-container {
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                display: block !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                transform: scale(1) !important;
            }
        }

        /* Star Rating CSS */
        .star-rating {
            color: #f59e0b;
        }

        /* Custom Arched Frame for Morgan Maxwell Template */
        .arch-top {
            border-top-left-radius: 120px;
            border-top-right-radius: 120px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-inter antialiased min-h-screen flex flex-col">

    <!-- Top Action Navigation Bar -->
    <header class="no-print bg-slate-800 border-b border-slate-700 h-16 flex items-center justify-between px-4 z-20 sticky top-0 shadow-md">

            <div>

        <!-- Canvas Controls & Export -->

        </div>
    </header>

    <!-- Main Editor & Preview Grid -->

            <!-- Sidebar Scrollable Body -->

                                <option value="font-montserrat">Montserrat (Clean & Bold)</option>
                                <option value="font-roboto">Roboto (Modern Sans)</option>
                                <option value="font-inter" selected>Inter (Balanced Neutral)</option>
                                <option value="font-poppins">Poppins (Geometric)</option>
                                <option value="font-opensans">Open Sans (Readable)</option>
                                <option value="font-lato">Lato (Warm & Friendly)</option>
                                <option value="font-playfair">Playfair Display (Serif Elegance)</option>
                            </select>
                        </div>

                        <!-- One-Page Auto Size Slider -->

                            </div>
                            <input type="range" id="fontSizeSlider" min="10" max="16" step="0.5" value="13" oninput="updateFontSize(this.value)" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                            <p class="text-[10px] text-slate-400 mt-1">Adjust if your text slightly overflows or leaves empty space.</p>
                        </div>
                    </div>

                    <!-- Colors Customization -->
                    <div class="bg-slate-750 p-4 rounded-xl border border-slate-700 space-y-4">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                            <i class="fa-solid fa-sliders text-blue-400"></i>
                            <span>Color Accents</span>
                        </h3>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Primary Theme</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="primaryColorPicker" value="#f59e0b" onchange="updateColors()" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                                    <span id="primaryColorHex" class="text-xs font-mono text-slate-300">#f59e0b</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Sidebar / Accent</label>
                                <div class="flex items-center space-x-2">
                                    <input type="color" id="accentColorPicker" value="#1f2937" onchange="updateColors()" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                                    <span id="accentColorHex" class="text-xs font-mono text-slate-300">#1f2937</span>
                                </div>

                        </div>
                    </div>

                    <!-- Photo Upload & Adjustments -->
                    <div class="bg-slate-750 p-4 rounded-xl border border-slate-700 space-y-4">

                        </h3>

                                    Upload Photo

                                <option value="rounded-none">Square / Rectangle</option>
                            </select>

                    </div>

                </div>

                <!-- TAB 2: CONTENT EDITING -->
                <div id="pane-content" class="hidden space-y-4">

                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400">Phone</label>
                                    <input type="text" id="input-phone" value="+1 0123 0000 1000" oninput="updateData()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[11px] text-slate-400">Location / Address</label>
                                    <input type="text" id="input-address" value="New York City, USA" oninput="updateData()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
                                </div>
                                <div>
                                    <label class="block text-[11px] text-slate-400">Website / Portfolio</label>
                                    <input type="text" id="input-website" value="www.contactme.com" oninput="updateData()" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-400">Profile / About Summary</label>

                            </div>
                        </div>

                    <!-- Accordion: Work Experience -->

                                <label class="block text-[11px] text-slate-400">Languages (Comma Separated)</label>

                            <div>
                                <label class="block text-[11px] text-slate-400">Awards / Certificates</label>

2021 | Certified Senior UX Specialist (NNG)</textarea>
                            </div>

                    </details>

                </div>
            </div>
        </aside>

        <!-- Right Interactive Preview Area -->
        <main class="flex-1 bg-slate-950 flex flex-col items-center justify-start overflow-auto p-4 md:p-8 relative">
            
            <!-- Dynamic A4 Paper Container -->
            <div id="canvasScaler" class="canvas-scale-container transition-transform duration-150 origin-top">
                <div id="cvPage" class="a4-page font-inter text-slate-800 relative shadow-2xl flex flex-col">

                </div>
            </div>

        </main>
    </div>

    <script>
        // State Management
        let currentTemplate = 'tpl-kelly';
        let currentFont = 'font-montserrat';
        let baseFontSize = 13;
        let zoomLevel = 1.0;
        let photoUrl = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80';

        let cvData = {
            fullName: 'KELLY WHITE',
            jobTitle: 'ART DIRECTOR',
            email: 'contactme@email.com',
            phone: '+0123 0000 1000',
            address: '123, Street Oclaho, New York City, USA',
            website: 'www.contactme.com',

        // TEMPLATE C: Isabel Mercado (Clean Modern Dark Sidebar Left)
        function renderIsabelTemplate(page, primaryColor, accentColor, photoShape, skillStyle) {
            page.innerHTML = `
                <div class="flex h-full w-full">
                    <!-- Left Sidebar -->
                    <div class="w-[35%] p-6 text-white flex flex-col justify-between" style="background-color: ${accentColor};">
                        <div class="space-y-6">
                            <div class="text-center">
                                <img src="${photoUrl}" class="w-28 h-28 ${photoShape} object-cover mx-auto mb-4 border-2 border-slate-500 shadow-md">
                            </div>

                            <div>
                                <h3 class="text-xs font-bold uppercase tracking-widest border-b border-slate-600 pb-1 mb-3">CONTACT</h3>
                                <div class="space-y-2 text-xs text-slate-300">
                                    <p><strong>Phone:</strong><br>${cvData.phone}</p>
                                    <p><strong>Email:</strong><br>${cvData.email}</p>
                                    <p><strong>Address:</strong><br>${cvData.address}</p>
                                    <p><strong>Website:</strong><br>${cvData.website}</p>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-bold uppercase tracking-widest border-b border-slate-600 pb-1 mb-3">EXPERTISE</h3>
                                ${renderSkillsList(skillStyle, primaryColor)}
                            </div>

                            ${cvData.languages ? `
                                <div>
                                    <h3 class="text-xs font-bold uppercase tracking-widest border-b border-slate-600 pb-1 mb-2">LANGUAGE</h3>
                                    <p class="text-xs text-slate-300 leading-relaxed">${cvData.languages}</p>
                                </div>
                            ` : ''}
                        </div>

                        ${cvData.awards ? `
                            <div>
                                <h3 class="text-xs font-bold uppercase tracking-widest border-b border-slate-600 pb-1 mb-2">AWARDS</h3>
                                <p class="text-[0.85em] text-slate-300 whitespace-pre-line leading-relaxed">${cvData.awards}</p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Main Content -->
                    <div class="w-[65%] p-8 bg-white flex flex-col justify-between text-slate-800">
                        <div>
                            <!-- Header Title -->
                            <div class="mb-6">
                                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">${cvData.fullName}</h1>
                                <p class="text-sm font-medium tracking-wide uppercase text-slate-500 mt-1">${cvData.jobTitle}</p>
                            </div>

                            <!-- Experience Section -->
                            <div class="mb-6">
                                <h3 class="text-sm font-bold uppercase tracking-wider border-b-2 border-slate-800 pb-1 mb-4">EXPERIENCE</h3>
                                <div class="space-y-4">
                                    ${cvData.experiences.map(exp => `
                                        <div>
                                            <div class="flex justify-between items-baseline">
                                                <span class="text-xs font-bold text-slate-800">${exp.years}</span>
                                                <span class="text-xs font-semibold text-slate-500">${exp.company}</span>
                                            </div>
                                            <h4 class="font-bold text-xs text-slate-900">${exp.title}</h4>
                                            <p class="text-xs text-slate-600 mt-1 leading-relaxed">${exp.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Education Section -->
                            <div class="mb-6">
                                <h3 class="text-sm font-bold uppercase tracking-wider border-b-2 border-slate-800 pb-1 mb-4">EDUCATION</h3>
                                <div class="space-y-3">
                                    ${cvData.educations.map(edu => `
                                        <div>
                                            <div class="flex justify-between items-baseline">
                                                <span class="text-xs font-bold text-slate-800">${edu.years}</span>
                                                <span class="text-xs font-medium text-slate-500">${edu.school}</span>
                                            </div>
                                            <h4 class="font-bold text-xs text-slate-900">${edu.degree}</h4>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // TEMPLATE D: Morgan Maxwell (Luxury Gold Arch Sidebar)
        function renderMorganTemplate(page, primaryColor, accentColor, photoShape, skillStyle) {
            page.innerHTML = `
                <div class="flex h-full w-full bg-white">
                    <!-- Left Arch Sidebar -->
                    <div class="w-[40%] p-6 text-white flex flex-col justify-between arch-top m-2" style="background-color: ${accentColor};">
                        <div class="space-y-5">
                            <div class="text-center pt-2">
                                <img src="${photoUrl}" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-amber-500 shadow-xl">
                                <h1 class="text-xl font-black uppercase mt-4 tracking-wider">${cvData.fullName}</h1>
                                <p class="text-xs text-amber-400 uppercase font-medium mt-0.5">${cvData.jobTitle}</p>
                            </div>

                            <p class="text-xs text-slate-300 leading-relaxed text-center px-2">${cvData.summary}</p>

                            <div class="space-y-2 border-t border-slate-800 pt-3 text-xs">
                                <p class="font-bold text-amber-400 uppercase tracking-widest text-center mb-2">CONTACT</p>
                                <div class="flex items-center space-x-2 text-slate-300">
                                    <i class="fa-solid fa-phone text-amber-400"></i><span>${cvData.phone}</span>
                                </div>
                                <div class="flex items-center space-x-2 text-slate-300">
                                    <i class="fa-solid fa-envelope text-amber-400"></i><span>${cvData.email}</span>
                                </div>
                                <div class="flex items-center space-x-2 text-slate-300">
                                    <i class="fa-solid fa-location-dot text-amber-400"></i><span>${cvData.address}</span>
                                </div>
                            </div>

                            <div>
                                <p class="font-bold text-amber-400 uppercase tracking-widest text-center mb-3 text-xs">SKILLS</p>
                                ${renderSkillsList(skillStyle, primaryColor)}
                            </div>
                        </div>
                    </div>

                    <!-- Right Main Content -->
                    <div class="w-[60%] p-6 flex flex-col justify-between text-slate-800">
                        <div class="space-y-6">
                            <!-- Education Header Pill -->
                            <div>
                                <div class="bg-amber-600 text-white font-bold text-xs uppercase px-4 py-1.5 rounded-r-full inline-block mb-3" style="background-color: ${primaryColor};">
                                    EDUCATION
                                </div>
                                <div class="space-y-3">
                                    ${cvData.educations.map(edu => `
                                        <div>
                                            <h4 class="font-bold text-xs text-slate-900">${edu.degree}</h4>
                                            <p class="text-[0.85em] text-slate-600">${edu.school} / ${edu.years}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Experience Header Pill -->
                            <div>
                                <div class="bg-amber-600 text-white font-bold text-xs uppercase px-4 py-1.5 rounded-r-full inline-block mb-3" style="background-color: ${primaryColor};">
                                    WORK EXPERIENCE
                                </div>
                                <div class="space-y-3">
                                    ${cvData.experiences.map(exp => `
                                        <div>
                                            <div class="flex justify-between">
                                                <h4 class="font-bold text-xs text-slate-900">${exp.title}</h4>
                                                <span class="text-[0.8em] text-slate-500 font-semibold">${exp.years}</span>
                                            </div>
                                            <p class="text-[0.85em] font-medium text-amber-600" style="color:${primaryColor}">${exp.company}</p>
                                            <p class="text-xs text-slate-600 mt-1 leading-relaxed">${exp.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Awards Header Pill -->
                            <div>
                                <div class="bg-amber-600 text-white font-bold text-xs uppercase px-4 py-1.5 rounded-r-full inline-block mb-2" style="background-color: ${primaryColor};">
                                    AWARDS & HONORS
                                </div>
                                <p class="text-xs whitespace-pre-line text-slate-600 leading-relaxed">${cvData.awards}</p>
                            </div>

                            <!-- Languages Pill -->
                            <div>
                                <div class="bg-amber-600 text-white font-bold text-xs uppercase px-4 py-1.5 rounded-r-full inline-block mb-2" style="background-color: ${primaryColor};">
                                    LANGUAGES
                                </div>
                                <p class="text-xs text-slate-600">${cvData.languages}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Skill Helper
        function renderSkillsList(style, colorHex, isDarkText = false) {
            const textColor = isDarkText ? 'text-slate-800' : 'text-slate-200';
            const bgBar = isDarkText ? 'bg-slate-200' : 'bg-slate-700';

            if (style === 'stars') {
                return `<div class="space-y-2">
                    ${cvData.skills.map(s => {
                        const stars = Math.round((s.level / 100) * 5);
                        return `
                            <div class="flex justify-between items-center text-xs">
                                <span class="${textColor} font-medium">${s.name}</span>
                                <div class="star-rating text-[10px]">
                                    ${[1,2,3,4,5].map(i => `<i class="fa-${i <= stars ? 'solid' : 'regular'} fa-star"></i>`).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>`;
            } else if (style === 'pills') {
                return `<div class="flex flex-wrap gap-1.5">
                    ${cvData.skills.map(s => `
                        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full text-white" style="background-color: ${colorHex};">
                            ${s.name}
                        </span>
                    `).join('')}
                </div>`;
            } else {
                // Default Progress Bars
                return `<div class="space-y-2.5">
                    ${cvData.skills.map(s => `
                        <div>
                            <div class="flex justify-between text-[0.8em] mb-1 ${textColor}">
                                <span>${s.name}</span>
                                <span>${s.level}%</span>
                            </div>
                            <div class="w-full h-1.5 ${bgBar} rounded-full overflow-hidden">
                                <div class="h-full rounded-full" style="width: ${s.level}%; background-color: ${colorHex}"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
            }
        }

        function checkPageOverflow() {
            const page = document.getElementById('cvPage');
            const badge = document.getElementById('overflowBadge');
            
            // Check if scroll height exceeds client height (297mm)
            if (page.scrollHeight > page.clientHeight + 2) {
                badge.className = "hidden sm:flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20";
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>Overflow! Lower Font Size</span>`;
            } else {
                badge.className = "hidden sm:flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                badge.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>1-Page Fit: OK</span>`;
            }
        }
    </script>
</body>
</html>
